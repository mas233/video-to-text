# Server Configuration
server.port=8080
server.servlet.context-path=/

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

qwen.api.key=${DASHSCOPE_API_KEY:}
qwen.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
qwen.model=qwen3-omni-flash

# Video Processing Configuration
video.temp.dir=${java.io.tmpdir}/video-summary
temp.file.cleanup.enabled=true

# Logging Configuration
logging.level.com.video.summary=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n